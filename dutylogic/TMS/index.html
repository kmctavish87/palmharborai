<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting to TMS</title>
    <meta http-equiv="refresh" content="0; url=https://tms.palmharborai.com/TMS/" />
    <style>
      :root {
        color-scheme: light;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at top left, rgba(37, 99, 235, 0.08), transparent 28%),
          linear-gradient(180deg, #f8fafc 0%, #eef2ff 100%);
        color: #0f172a;
      }

      .card {
        width: min(560px, 100%);
        padding: 28px;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid rgba(226, 232, 240, 0.92);
        box-shadow: 0 18px 48px rgba(15, 23, 42, 0.1);
      }

      h1 {
        margin: 0 0 10px;
        font-size: 1.5rem;
      }

      p {
        margin: 0;
        line-height: 1.6;
        color: #475569;
      }

      a {
        color: #1d4ed8;
        font-weight: 700;
      }
    </style>
    <script>
      window.location.replace("https://tms.palmharborai.com/TMS/");
    </script>
  </head>
  <body>
    <main class="card">
      <h1>Moving you to the TMS dashboard</h1>
      <p>
        If the redirect does not happen automatically, continue to
        <a href="https://tms.palmharborai.com/TMS/">tms.palmharborai.com/TMS/</a>.
      </p>
    </main>
  </body>
</html>
